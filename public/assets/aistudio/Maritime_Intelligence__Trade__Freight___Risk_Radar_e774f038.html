[0,.5,1].forEach(t=>{const v=mn+(mx-mn)*t;o+=`<line x1="${p}" x2="${w-60}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="0" y="${Y(v)+3}">${f0(v)}</text>`});
lab.forEach((t,i)=>o+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle">${t}</text>`);
const C=["var(--teal)","var(--amb)","var(--red)","var(--grn)","#8aa4d6"];
ser.forEach((s,k)=>{const pp=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);o+=`<polyline fill="none" stroke="${C[k%5]}" stroke-width="1.6" points="${pp.map(a=>a.join(",")).join(" ")}"/>`+pp.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="2.5" fill="${C[k%5]}"/>`).join("");
const e=pp[pp.length-1];o+=`<text x="${e[0]+6}" y="${e[1]+3}" style="fill:${C[k%5]}">${s.n}</text>`});return o+"</svg>"}
function hbars(rows,w=520){const m=Math.max(...rows.map(r=>Math.abs(r.v)),1),h=rows.length*24+6,x0=w/2+50;
return `<svg viewBox="0 0 ${w} ${h}" width="100%">`+rows.map((r,i)=>{const bw=Math.abs(r.v)/m*(w/2-90);
return `<text x="0" y="${i*24+16}">${r.l}</text><rect x="${r.v<0?x0-bw:x0}" y="${i*24+5}" width="${bw}" height="14" fill="${r.v<0?"var(--red)":"var(--grn)"}" opacity=".85"/><text x="${r.v<0?x0-bw-4:x0+bw+4}" y="${i*24+16}" text-anchor="${r.v<0?"end":"start"}">${pc(r.v)}</text>`}).join("")+"</svg>"}
function waterfall(items,w=520,h=210){let t=0;const tot=items.reduce((a,b)=>a+b.v,0)||1,p=30,bw=(w-p)/(items.length+1)-8,Y=v=>h-30-v/tot*(h-50);let o=`<svg viewBox="0 0 ${w} ${h}" width="100%">`;
items.forEach((it,i)=>{const x=p+i*(bw+8);o+=`<rect x="${x}" y="${Y(t+it.v)}" width="${bw}" height="${Math.max(1,Y(t)-Y(t+it.v))}" fill="${it.hot?"var(--amb)":"var(--teal)"}"/><text x="${x+bw/2}" y="${h-16}" text-anchor="middle">${it.l}</text><text x="${x+bw/2}" y="${Y(t+it.v)-3}" text-anchor="middle">${f0(it.v)}</text>`;t+=it.v});
const x=p+items.length*(bw+8);return o+`<rect x="${x}" y="${Y(tot)}" width="${bw}" height="${Y(0)-Y(tot)}" fill="var(--tx)" opacity=".75"/><text x="${x+bw/2}" y="${h-16}" text-anchor="middle">Total</text><text x="${x+bw/2}" y="${Y(tot)-3}" text-anchor="middle">${f0(tot)}</text></svg>`}
const a=(u,t)=>u?`<a href="${u}" target="_blank" rel="noopener">${t||"source"}</a>`:"";
const R={};
R.pulse=()=>{const w=D.wci,L=lanes().filter(l=>l.a[0]!=null||l.a[1]!=null);
return `<div class="g g4">
<div class="c k"><h2>Drewry WCI composite</h2><div class="v n">$${f0(w[3][1])}</div><div class="s"><span class="up">+2.2% WoW</span> · <span class="up">${pc((w[3][1]/w[1][1]-1)*100)}</span> vs 8 Oct · USD/FEU · 22 Oct</div></div>
<div class="c k"><h2>Shanghai → Los Angeles</h2><div class="v n">$${f0(8007)}</div><div class="s">${pc(chg(D.lanes[0]))} vs ${D.dates[bi()]} · Drewry</div></div>
<div class="c k"><h2>Shanghai port wait</h2><div class="v n up">38 h</div><div class="s">from 97 h in wk38 (−61%) · Drewry wk42</div></div>
<div class="c k"><h2>India merch. exports, Sep</h2><div class="v n up">$44.40B</div><div class="s">+23.04% YoY · deficit $30.21B · MoCI 15 Oct</div></div></div>
<div class="g g2"><div class="c"><h2>WCI spot, selected lanes (USD/FEU)</h2>${line(L.map(l=>({n:l.id,v:l.a.slice(0,3),x:D.dates})))}<div class="s">Only the dates Drewry values could be retrieved for; uneven spacing (20 Aug, 8 Oct, 22 Oct). ${a(D.src[0][2],"Drewry")}</div></div>
<div class="c brief"><h2>Daily brief · 24 Oct 2026</h2>
<div><b>WHAT'S MOVING</b><br>WCI up two weeks running to $4,585. Asia–Europe rising off a low (SHA–RTM ${pc(chg(D.lanes[2]))} vs ${D.dates[bi()]}); transpacific stays high (SHA–LAX $8,007).</div>
<div><b>WHY IT MATTERS</b><br>Carriers are blanking sailings (8 on Asia–Europe next week vs 2) and applying GRIs ahead of 2027 contract talks, while Suez returns add effective capacity. Rate moves are supply-side signals; they do not prove demand changed.</div>
<div><b>WHAT TO WATCH</b><br>Whether blank sailings persist, Hormuz/Bab el-Mandeb incidents, and Suez transit counts (55 in wk42). Confidence: <span class="wa">medium</span>.</div></div></div>
<div class="c"><h2>Attention feed</h2>
<div><span class="dn">●</span> Hormuz: Iranian attacks stepped up; container ship sunk last week ${a(D.falls[5].lk,"Freightos")}</div>
<div><span class="wa">●</span> Asia–Europe: 8 blank sailings announced next week (2 this week); expect slight rate rise ${a(D.src[0][2],"Drewry")}</div>
<div><span class="wa">●</span> Red Sea return expected to complete in Q1 2027; raises 2027 overcapacity risk ${a(D.src[1][2],"Freightos")}</div>
<div><span class="up">●</span> India: Sep exports +23%; first-half deficit still widening ($177.64B) ${a(D.opps[0].lk,"MoCI via press")}</div>
<div><span class="wa">●</span> Baltic Exchange: Asia→USEC fell 10,754→9,927 in a week (separate index) ${a(D.falls[4].lk,"Baltic")}</div></div>`};
R.opps=()=>{const def={t:"Change",d:-1,f:o=>o.v};const cols=[["Opportunity",o=>o.n],["Type",o=>o.t],["Metric",o=>o.m],["Change",o=>o.v],["Confidence",o=>o.cf]];
const rows=srt(D.opps.filter(o=>(o.n+o.t+o.sc).toLowerCase().includes(q())),"opps",def);const s=sort.opps;s.f=(cols.find(c=>c[0]===s.t)||cols[3])[1];
const o=rows[Math.min(sel,rows.length-1)];
return `<div class="c"><h2>Opportunities radar · evidence-ranked; "Change" is the sourced growth figure where one exists (not a composite score)</h2><div class="sx"><table><tr>${th("opps",cols,def)}</tr>${rows.map((r,i)=>`<tr class="cl" data-r="${i}"><td>${r.n}</td><td>${r.t}</td><td>${r.m}</td><td class="n ${col(r.v)}">${r.v==null?"n/a":pc(r.v)}</td><td>${r.cf}</td></tr>`).join("")||`<tr><td colspan=5 class="empty">No matches.</td></tr>`}</table></div>
${o?`<div class="det"><b>${o.n}</b> · ${o.sc}<br><b>Evidence:</b> ${o.ev}<br><b>Who could benefit:</b> ${o.who}<br><b>Risks / counter-evidence:</b> ${o.rk}<br><b>Note:</b> trade-flow growth ≠ demand ≠ commercial opportunity; the last is a hypothesis. ${a(o.lk)}</div>`:""}</div>
<div class="c"><h2>Sourced change figures</h2>${hbars(D.opps.filter(o=>o.v!=null).map(o=>({l:o.n.slice(0,28),v:o.v})))}</div>`};
R.falls=()=>{const def={t:"Change",d:1,f:x=>x.ch};const cols=[["Item",x=>x.n],["Change",x=>x.ch],["Basis",x=>x.b],["Class",x=>x.cl],["Kind",x=>x.kind]];
const rows=srt(D.falls.filter(x=>(x.n+x.cl+x.kind).toLowerCase().includes(q())),"falls",def);const s=sort.falls;s.f=(cols.find(c=>c[0]===s.t)||cols[1])[1];const o=rows[Math.min(sel,rows.length-1)];
const kc={"Sharp deterioration":"dn","Persistent decline":"dn","Emerging warning":"wa","Temporary volatility":"mu"};
return `<div class="c"><h2>Hardest falls · price falls ≠ demand falls (see Kind)</h2><div class="sx"><table><tr>${th("falls",cols,def)}</tr>${rows.map((r,i)=>`<tr class="cl" data-r="${i}"><td>${r.n}</td><td class="n ${col(r.ch)}">${r.ch==null?"n/a":pc(r.ch)}</td><td>${r.b.replace("vs baseline","vs "+D.dates[bi()]).replace("vs 20 Aug","vs 20 Aug")}</td><td><span class="badge ${kc[r.cl]||"mu"}">${r.cl}</span></td><td>${r.kind}</td></tr>`).join("")||`<tr><td colspan=5 class="empty">No matches.</td></tr>`}</table></div>
${o?`<div class="det"><b>${o.n}</b><br><b>Plausible driver:</b> ${o.dr}<br><b>Exposed:</b> ${o.ex}<br><b>Confirm / invalidate with:</b> ${o.cf}<br>Drivers are hypotheses, not established causes. ${a(o.lk)}</div>`:""}</div>`};
R.freight=()=>{const L=lanes();return `<div class="g g2"><div class="c"><h2>Change since ${D.dates[bi()]} (WCI, USD/FEU)</h2>${hbars(D.lanes.filter(l=>chg(l)!=null).map(l=>({l:l.id,v:chg(l)})))}</div>
<div class="c"><h2>Freightos FBX points quoted in weekly updates</h2><div class="sx"><table><tr><th>Lane</th><th>Points (USD/FEU)</th><th>Δ first→last</th></tr>${D.fbx.map(f=>`<tr><td>${f.n}</td><td class="n">${f.p.map(p=>p[0]+": "+p[1]).join(" · ")}</td><td class="n ${col(fchg(f))}">${pc(fchg(f))}</td></tr>`).join("")}</table></div><div class="s">FBX and WCI are different indices (methodology, ports, timing). Do not compare levels across them.</div></div></div>
<div class="c"><h2>WCI lane table · 22 Oct 2026</h2><div class="sx"><table><tr><th>Lane</th><th>20 Aug</th><th>8 Oct</th><th>22 Oct</th><th>Δ vs ${D.dates[bi()]}</th></tr>${L.filter(l=>l.n.toLowerCase().includes(q())).map(l=>`<tr><td>${l.n}</td>${l.a.map(v=>`<td class="n">${v==null?"n/a":f0(v)}</td>`).join("")}<td class="n ${col(chg(l))}">${pc(chg(l))}</td></tr>`).join("")}</table></div>
<div class="s">Capacity: Asia–Europe 8 blank sailings next week (from 2); transpacific 2 (from 6) per Drewry. Intra-Asia IACI $1,459 (+$6). Not available here: contract rates, GRI database, bunker surcharges, equipment imbalance. India lanes: no free published index found.</div></div>`};
R.ports=()=>`<div class="c"><h2>Chokepoints & port indicators · latest verified</h2><div class="sx"><table><tr><th>Node</th><th>Latest reading</th><th>Source / date</th></tr>${D.chokes.filter(r=>r.join(" ").toLowerCase().includes(q())).map(r=>`<tr><td><span class="${r[3]}">●</span> ${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")||`<tr><td colspan=3 class="empty">No matches.</td></tr>`}</table></div>
<div class="s">Status dot: green improving, amber developing/uncertain, red high risk, grey stale/unknown. No AIS feed is connected, so no map is shown. Current JNPT/Mundra/Chennai dwell and wait figures were not found in free sources; the India row is dated.</div></div>
<div class="c"><h2>What to do with this</h2><div>• Gulf-bound cargo: check war-risk and routing before booking.<br>• W. India exporters: confirm terminal and rail slots; expect yard-density risk (hypothesis, dated reports).<br>• Asia–Europe importers: Suez return and blank sailings pull in opposite directions through Q1.</div></div>`;
const LF=[["cargo","Cargo value (USD)",38000],["ins","Insurance %",0.3],["orig","Origin charges",320],["dest","Destination charges",410],["inl","Inland transport",380],["duty","Duty % (on CIF)",7.5],["free","Free days",5],["dd","Demurrage/day",140],["stor","Storage/day",90]];
R.landed=()=>`<div class="g g2"><div class="c"><h2>Landed cost per FEU</h2><div id="wf"></div><div class="n" id="tot"></div><div class="s">Ocean leg uses a real Drewry WCI lane; every other input is an editable ASSUMPTION (no shipment data connected). Incoterms and tariff lines change the result. Not a quote.</div></div>
<div class="c"><h2>Inputs (illustrative scenario, not a forecast)</h2><div class="f"><div><label>Ocean lane (WCI 22 Oct)</label><select id="lf">${D.lanes.filter(l=>l.a[2]).map(l=>`<option value="${l.a[2]}">${l.id} · $${f0(l.a[2])}</option>`).join("")}</select></div>
<div><label>Freight shift %</label><input id="fs2" type="range" min="-30" max="40" value="0"><span class="n" id="v1">0%</span></div><div><label>Added delay (days)</label><input id="dd2" type="range" min="0" max="14" value="0"><span class="n" id="v2">0d</span></div></div>
<div class="f">${LF.map(([k,t,d])=>`<div><label>${t}</label><input type="number" id="in_${k}" value="${d}" step="any"></div>`).join("")}</div></div></div>
<div class="c"><h2>Shipment register</h2><div class="empty">No shipment feed connected. Live ETA, last-free-day and demurrage tracking need a carrier/TMS integration, so none is simulated here.</div></div>`;
function calc(){const g=k=>+$("#in_"+k).value||0,fr=+$("#fs2").value,dl=+$("#dd2").value;$("#v1").textContent=fr+"%";$("#v2").textContent=dl+"d";
const o=+$("#lf").value*(1+fr/100),ins=g("cargo")*g("ins")/100,duty=(g("cargo")+o+ins)*g("duty")/100,ex=Math.max(0,dl-g("free"));
const it=[{l:"Ocean",v:o},{l:"Insur.",v:ins},{l:"Origin",v:g("orig")},{l:"Dest.",v:g("dest")},{l:"Inland",v:g("inl")},{l:"Duty",v:duty},{l:"Storage",v:ex*g("stor"),hot:1},{l:"Dem/Det",v:ex*g("dd"),hot:1}];
const t=it.reduce((a,b)=>a+b.v,0);$("#wf").innerHTML=waterfall(it);$("#tot").innerHTML=`Total <b>$${f0(t)}</b> per FEU`}
R.src=()=>`<div class="c"><h2>Data catalog · as of 24 Oct 2026</h2><div class="sx"><table><tr><th>Source</th><th>As of</th><th>Link</th><th>Coverage / limits</th></tr>${D.src.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${a(s[2],"open")}</td><td>${s[3]}</td></tr>`).join("")}</table></div>
<div class="s" style="margin-top:8px">This is a dated snapshot. Published pages cannot call external data APIs, so figures update only when the snapshot is rebuilt. Ask Claude to re-run the research and republish.</div></div>`;
function draw(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===view));$("#v").innerHTML=`<div class="hd"><h1>${HD[view][0]}</h1><p>${HD[view][1]}</p></div>`+R[view]();
if(view==="landed"){calc();$("#v").querySelectorAll("input,select").forEach(e=>e.addEventListener("input",calc))}}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.k;sel=0;draw()}};
$("#fl").onchange=$("#fr").onchange=draw;$("#fs").oninput=()=>{sel=0;draw()};
$("#th").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"":"light"};
$("#v").onclick=e=>{const h=e.target.closest("th[data-s]");if(h){const s=sort[h.dataset.s];s.d=s.t===h.dataset.i?-s.d:1;s.t=h.dataset.i;draw();return}
const r=e.target.closest("tr[data-r]");if(r){sel=+r.dataset.r;draw()}};
$("#dl").onclick=()=>{const m={pulse:D.lanes,freight:D.lanes}[view];let rows;
if(m)rows=[["lane","20 Aug","8 Oct","22 Oct"],...D.lanes.map(l=>[l.n,...l.a.map(v=>v==null?"":v)])];
else if(view==="opps")rows=[["opportunity","metric","change_pct"],...D.opps.map(o=>[o.n,o.m,o.v??""])];
else if(view==="falls")rows=[["item","change_pct","basis","class","kind"],...D.falls.map(f=>[f.n,f.ch==null?"":f.ch.toFixed(1),f.b,f.cl,f.kind])];
else if(view==="ports")rows=[["node","reading","source"],...D.chokes.map(r=>r.slice(0,3))];
else if(view==="src")rows=[["source","as_of","url"],...D.src.map(s=>s.slice(0,3))];
else{alert("Nothing to export in this view.");return}
const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
const el=document.createElement("a");el.href="data:text/csv;charset=utf-8,"+encodeURIComponent("Snapshot 24 Oct 2026; see Sources tab\n"+csv);el.download=view+"-snapshot.csv";el.click()};
draw();
</script></body></html>
